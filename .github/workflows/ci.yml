name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build addon and example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Build the example Storybook
        working-directory: examples/react
        run: |
          npm install
          npm run build-storybook

  compat:
    name: Storybook ${{ matrix.storybook }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storybook: ["6", "7", "8", "9", "10", "11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/compat-test.mjs ${{ matrix.storybook }}
